<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Resilient Event Landing Page</title>

    <link rel="stylesheet" href="landing.css">
</head>

<body>

    <header>
        <h1>Web Engineering Event 2027</h1>

        <p>
            Join our upcoming web engineering event.
        </p>
    </header>

    <main>

        <section
            id="countdown-section"
            aria-labelledby="countdown-heading"
        >
            <h2 id="countdown-heading">
                Event Countdown
            </h2>

            <p
                id="countdown"
                data-deadline="2026-12-31T17:00:00Z"
                aria-live="polite"
            >
                Loading countdown...
            </p>
        </section>

        <section
    id="registration-section"
    aria-labelledby="registration-heading"
>
    <h2 id="registration-heading">
        Event Registration
    </h2>

    <form id="registration-form" novalidate>

        <label for="full-name">
            Full Name
        </label>

        <input
            type="text"
            id="full-name"
            name="fullName"
            required
            minlength="2"
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <button
            type="submit"
            id="submit-btn"
        >
            Register
        </button>

        <p
            id="form-status"
            role="status"
            aria-live="polite"
        >
            Ready to submit.
        </p>
        <section
    id="submission-preview"
    aria-labelledby="preview-heading"
    hidden
>
    <h3 id="preview-heading">
        Submitted Registration
    </h3>

    <p>
        Name:
        <span id="preview-name"></span>
    </p>

    <p>
        Email:
        <span id="preview-email"></span>
    </p>
</section>

    </form>
</section>

    </main>

    

    <footer>
        <p>&copy; 2026 Ha Nguyen Viet Thanh</p>
    </footer>

    <script src="countdown.js"></script>
    <script src="form-state.js"></script>

</body>

</html>
