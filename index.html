
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Enterprise Data-Grid | Lab 2</title>
  </head>
  <body>
    <a href="#main-content" class="skip-link">
      Skip to main content
    </a>

    <header class="site-header">
      <h1>Enterprise Data-Grid</h1>
      <p>Accessible Product Inventory Management</p>
    </header>

    <main id="main-content" tabindex="-1">
      <section class="dashboard" aria-labelledby="inventory-title">
        <header class="dashboard-header">
          <h2 id="inventory-title">Product Inventory</h2>
          <p>Manage and review product information.</p>
        </header>

        <section class="grid-toolbar" aria-label="Product filters">
  <label for="product-search">Search Products</label>

  <input
    type="search"
    id="product-search"
    name="product-search"
    placeholder="Search by ID, name or category..."
    autocomplete="off"
  />

  <p id="search-status" role="status" aria-live="polite">
    Showing all products.
  </p>
</section>
<p id="selection-status" class="selection-status" role="status" aria-live="polite">
  No products selected.
</p>
<section id="grid-root" aria-label="Product data grid">
</section>

<nav class="pagination" aria-label="Product pagination">
  <section class="pagination-size">
    <label for="page-size">Rows per page:</label>

    <select id="page-size">
      <option value="5" selected>5</option>
      <option value="10">10</option>
      <option value="20">20</option>
    </select>
  </section>

  <p id="page-info" role="status">
    Page 1 of 2
  </p>

  <section class="pagination-actions">
    <button id="prev-page" type="button">
      Previous
    </button>

    <button id="next-page" type="button">
      Next
    </button>
  </section>
</nav>
      </section>
    </main>

    <footer class="site-footer">
      <p>Lab 2 — Web Application Development</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
