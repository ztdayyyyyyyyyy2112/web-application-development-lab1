<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Drum Kit Engine</title>
</head>

<body>

    <header>
        <h1>Drum Kit Engine</h1>

        <p>
            Play the drum kit using the keyboard or the drum pads.
        </p>
    </header>

    <main>

        <section aria-labelledby="drum-kit-heading">

            <h2 id="drum-kit-heading">
                Drum Pads
            </h2>

            <section
                class="drum-grid"
                aria-label="Interactive drum pads"
            >

                <button
                    type="button"
                    class="drum-pad"
                    data-key="a"
                    data-sound="assets/sounds/kick.wav"
                >
                    <strong>Kick</strong>
                    <span>Key A</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-key="s"
                    data-sound="assets/sounds/snare.wav"
                >
                    <strong>Snare</strong>
                    <span>Key S</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-key="d"
                    data-sound="assets/sounds/hihat.wav"
                >
                    <strong>Hi-Hat</strong>
                    <span>Key D</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-key="f"
                    data-sound="assets/sounds/clap.wav"
                >
                    <strong>Clap</strong>
                    <span>Key F</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-key="g"
                    data-sound="assets/sounds/tom.wav"
                >
                    <strong>Tom</strong>
                    <span>Key G</span>
                </button>

                <button
                    type="button"
                    class="drum-pad"
                    data-key="h"
                    data-sound="assets/sounds/crash.wav"
                >
                    <strong>Crash</strong>
                    <span>Key H</span>
                </button>
                <section aria-labelledby="recorder-heading">
    <h2 id="recorder-heading">Beat Recorder</h2>

    <p id="recording-status" aria-live="polite">
        Recorder idle
    </p>

    <button type="button" id="record-btn">
        Start Recording
    </button>

    <button type="button" id="stop-btn" disabled>
        Stop Recording
    </button>

    <button type="button" id="play-recording-btn" disabled>
        Play Recording
    </button>

    <button type="button" id="clear-recording-btn" disabled>
        Clear Recording
    </button>
</section>

            </section>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Ha Nguyen Viet Thanh</p>
    </footer>
    <script src="audio-engine.js"></script>
    <script src="beat-recorder.js"></script>
    <script src="keyboard-controller.js"></script>
</body>

</html>
